<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1095 1095"
     width="1095" height="1095">
  <defs>
    <!-- E + orbit: deliberately very dark navy, like the original logo -->
    <linearGradient id="eGrad" gradientUnits="userSpaceOnUse"
                    x1="100" y1="520" x2="610" y2="520">
      <stop offset="0%" stop-color="#08162F"/>
      <stop offset="42%" stop-color="#0D1E3E"/>
      <stop offset="72%" stop-color="#142B50"/>
      <stop offset="100%" stop-color="#233F68"/>
    </linearGradient>

    <!-- Whole crescent shares ONE continuous gradient, regardless of its two path pieces -->
    <linearGradient id="moonGrad" gradientUnits="userSpaceOnUse"
                    x1="445" y1="255" x2="900" y2="835">
      <stop offset="0%" stop-color="#173B70"/>
      <stop offset="16%" stop-color="#225A9E"/>
      <stop offset="34%" stop-color="#4196EC"/>
      <stop offset="51%" stop-color="#72B9FF"/>
      <stop offset="66%" stop-color="#A9B3FF"/>
      <stop offset="81%" stop-color="#D4BEF6"/>
      <stop offset="92%" stop-color="#EBC8E9"/>
      <stop offset="100%" stop-color="#F7D5DC"/>
    </linearGradient>

    <!-- Small decorative marks stay blue, as in the original -->
    <linearGradient id="starGrad" gradientUnits="userSpaceOnUse"
                    x1="680" y1="470" x2="1015" y2="620">
      <stop offset="0%" stop-color="#2366BD"/>
      <stop offset="48%" stop-color="#3784EF"/>
      <stop offset="100%" stop-color="#6AA8FF"/>
    </linearGradient>

    <linearGradient id="centerStarGrad" gradientUnits="userSpaceOnUse"
                    x1="560" y1="500" x2="645" y2="585">
      <stop offset="0%" stop-color="#102B52"/>
      <stop offset="100%" stop-color="#245B9C"/>
    </linearGradient>

    <!-- Very subtle softness, kept restrained so it still behaves as a logo -->
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.25"/>
    </filter>
  </defs>

